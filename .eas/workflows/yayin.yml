# Elle başlatılır (Claude, Expo bağlantısıyla). GitHub'da EXPO_TOKEN olmadığı sürece yayın bununla yapılır.
# Expo Go için güncellemeyi yayınlar ve bağlantıyı günlüğe basar.
name: Expo Go guncellemesi (Expo)

jobs:
  kur:
    name: Kur ve yayinla
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Proje kimligi ve guncelleme
        run: |
          set -e
          EAS="npx -y eas-cli@latest"
          command -v eas >/dev/null 2>&1 && EAS="eas"
          $EAS update --branch main --message "$(git log -1 --pretty=%s 2>/dev/null || echo Guncelleme)" --non-interactive --json > sonuc.json
          cat sonuc.json
          KIMLIK="$(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")"
          GRUP="$(node -e "const s=require('./sonuc.json');const a=Array.isArray(s)?s:[s];console.log(a[0].group)")"
          echo "EXPO_GO_BAGLANTISI=exp://u.expo.dev/${KIMLIK}/group/${GRUP}"
